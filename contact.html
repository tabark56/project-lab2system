<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Saffarni</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>saffarni</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main>
        <p>Share your trip details and preferences to start planning your journey.</p>
        <form>
            <div class="row">
                <label for="name">Name</label><br>
                <input class="field" type="text" id="name" name="name" placeholder="name" required>
            </div>
            <div class="row">
                <label for="email">Email</label><br>
                <input class="field" type="email" id="email" name="email" placeholder="email" required>
            </div>
            <div class="row">
                <label for="phone">Phone</label><br>
                <input class="field" type="tel" id="phone" name="phone" placeholder="phone" required>
            </div>
            <div class="row">
                <label for="payment">Cash payment</label><br>
                <input class="field" type="number" id="payment" name="payment" placeholder="number" required>
            </div>
            <div class="row">
                <label for="date">Date</label><br>
                <input class="field" type="date" id="date" name="date" required>
            </div>
            <div class="row">
                <label for="from">From</label><br>
                <select class="field" id="from" name="from">
                    <option value="egypt">Egypt</option>
                    <option value="canada">Canada</option>
                    <option value="japan">Japan</option>
                </select>
            </div>
            <div class="row">
                <label for="to">To</label><br>
                <select class="field" id="to" name="to">
                    <option value="egypt">Egypt</option>
                    <option value="canada">Canada</option>
                    <option value="japan">Japan</option>
                </select>
            </div>
            <div class="row">
                <label for="outbound-date">Outbound date</label><br>
                <input class="field" type="date" id="outbound-date" name="outbound-date" required>
            </div>
            <div class="row">
                <label for="inbound-date">Inbound date</label><br>
                <input class="field" type="date" id="inbound-date" name="inbound-date" required>
            </div>
            <fieldset>
                <legend>Seat preference:</legend>
                <div>
                    <input type="radio" id="window" name="level" value="1" required>
                    <label for="window">Window seat</label>
                </div>
                <div>
                    <input type="radio" id="middle" name="level" value="2" required>
                    <label for="middle">Middle seat</label>
                </div>
                <div>
                    <input type="radio" id="seat-neighbor" name="level" value="3" required>
                    <label for="seat-neighbor">Aisle seat</label>
                </div>
            </fieldset>
            <fieldset>
                <legend>Food preference:</legend>
                <div>
                    <input type="checkbox" id="vegetables" name="food" value="vegetables" required>
                    <label for="vegetables">Vegetables</label>
                </div>
                <div>
                    <input type="checkbox" id="fruits" name="food" value="fruits" required>
                    <label for="fruits">Fruits</label>
                </div>
                <div>
                    <input type="checkbox" id="meat" name="food" value="meat" required>
                    <label for="meat">Meat</label>
                </div>
            </fieldset>
            <div class="row">
                <label for="comment">Comments</label><br>
                <textarea class="field" id="comment" name="comment" rows="5" cols="30" placeholder="Comments"></textarea>
            </div>
            <a href="#myModal" class="submit-btn">Submit
                
            </a>

<div id="myModal" class="modal">
    <div class="modal-content">
        <p>  Are you sure about data?   </p>
        <a href="#successAlert" class="btn-ok">OK</a>
        <a href="#" class="btn-close">Cancel</a>
    </div>
</div>

<div id="successAlert" class="alert-success">
Saved successfully!
    <a href="#" class="close-alert">&times;</a>
</div>

</form>
    </main>
    <footer>
        <p>&copy; 2026 Saffarni</p>
    </footer>
</body>
</html>
